{% extends "base.html" %}
{% block title %}{{ t('Error {code} — wg-admin', code=code) }}{% endblock %}
{% block content %}
<div class="container">
  <div class="error-page">
    <p class="error-code">{{ code }}</p>
    <p class="error-message">{{ message }}</p>
    <a href="{{ url_for('peers_list') }}" class="btn">{{ t('← Back to peers') }}</a>
  </div>
</div>
{% endblock %}
