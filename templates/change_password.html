{% extends "base.html" %}
{% block title %}{{ t('Change password — wg-admin') }}{% endblock %}
{% block content %}
<div class="container">
  <h1><span class="accent-bar"></span>{{ t('Change password') }}</h1>
  <p class="subtitle">{{ t('// argon2id · m=16MB · t=3 · p=1') }}</p>

  <form method="post" action="{{ url_for('change_password') }}">
    <label for="current">{{ t('CURRENT PASSWORD') }}</label>
    <input type="password" id="current" name="current" required autocomplete="current-password">

    <label for="new">{{ t('NEW PASSWORD') }} <span class="text-muted text-sm">{{ t('(min 8 characters)') }}</span></label>
    <input type="password" id="new" name="new" required minlength="8" autocomplete="new-password">

    <label for="confirm">{{ t('CONFIRM') }}</label>
    <input type="password" id="confirm" name="confirm" required minlength="8" autocomplete="new-password">

    <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">
    <div style="display: flex; gap: 0.5rem; margin-top: 0.5rem;">
      <button type="submit" onclick="this.disabled=true; this.innerHTML='{{ t('Saving…') }}'; this.form.submit();">{{ t('Save') }}</button>
      <a href="{{ url_for('peers_list') }}" class="btn secondary">{{ t('Cancel') }}</a>
    </div>
  </form>
</div>
{% endblock %}
